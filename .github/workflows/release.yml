name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.repository == 'Kningc/UMX-Bot'
    runs-on: ubuntu-latest
    env:
      # Publishing is opt-in: until the repository variable NPM_PUBLISH_ENABLED
      # is "true" the workflow still opens the Version PR but publishes
      # nothing. Turn it on once every package has a Trusted Publisher on npm.
      PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted Publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version-file: .nvmrc
          cache: pnpm
          # No registry-url: it writes an .npmrc auth line, and any configured
          # token makes npm skip the OIDC exchange.

      - name: Install npm with Trusted Publishing support
        run: npm install -g npm@11.21.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r --if-present build

      # 有未消费的 changeset 时开 "Version Packages" PR；
      # 该 PR 合并后这一步会实际发布到 npm。
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # v2 renamed the inputs and no longer reads GITHUB_TOKEN from env.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm version-packages
          publish-script: ${{ env.PUBLISH_ENABLED == 'true' && 'node scripts/publish-packages.mjs' || '' }}
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
