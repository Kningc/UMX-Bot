name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.repository == 'Kningc/UMX-Bot'
    runs-on: ubuntu-latest
    env:
      # Secrets cannot be read in an `if`, so surface "is it configured" as an
      # env var. Without NPM_TOKEN the workflow still opens the Version PR but
      # does not attempt to publish, instead of failing after the merge.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.13"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r --if-present build

      # 有未消费的 changeset 时开 "Version Packages" PR；
      # 该 PR 合并后这一步会实际发布到 npm。
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # v2 renamed the inputs and no longer reads GITHUB_TOKEN from env.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm version-packages
          publish-script: ${{ env.HAS_NPM_TOKEN == 'true' && 'pnpm exec changeset publish' || '' }}
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          # v2 no longer writes .npmrc from NPM_TOKEN; setup-node's registry-url
          # writes one that reads NODE_AUTH_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Attach signed build provenance (uses the job's id-token permission).
          NPM_CONFIG_PROVENANCE: "true"
