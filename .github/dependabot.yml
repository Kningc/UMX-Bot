version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for every non-breaking npm update, prod and dev alike.
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the lowest supported runtime (engines: node >=22.13);
      # newer majors would type-check APIs that Node 22 does not have.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # Compiler majors change emitted code and diagnostics; upgrade on purpose.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The runtime major is chosen together with engines and the CI matrix.
      - dependency-name: node
        update-types: [version-update:semver-major]
